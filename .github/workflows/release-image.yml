name: Release image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - README.md
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply when run from a branch.
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  # Required to push the version commit/tag and create the GitHub release.
  contents: write
  # Required to publish the image to GitHub Container Registry.
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump semantic version
        id: bump
        shell: bash
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "${latest_tag}" ]]; then
            major=0
            minor=0
            patch=0
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<<"${version}"
          fi

          case "${BUMP}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump type: ${BUMP}" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          next_tag="v${next_version}"

          if git rev-parse "${next_tag}" >/dev/null 2>&1; then
            echo "Tag already exists: ${next_tag}" >&2
            exit 1
          fi

          printf '%s\n' "${next_version}" > VERSION

          image_ref="${REGISTRY}/${IMAGE_NAME}:${next_tag}"
          WORKSPACE_IMAGE="${image_ref}" python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          
          path = Path("main.tf")
          image_ref = os.environ["WORKSPACE_IMAGE"]
          text = path.read_text()
          text, count = re.subn(
              r'(data "coder_parameter" "workspace_image" \{.*?default\s+= ")[^"]+(".*?\n\})',
              rf'\1{image_ref}\2',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("failed to update workspace_image default in main.tf")
          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION main.tf
          git commit -m "chore: bump version to ${next_tag} [skip ci]"
          git tag -a "${next_tag}" -m "Release ${next_tag}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${next_tag}"
          gh release create "${next_tag}" \
            --title "${next_tag}" \
            --notes "Workspace image release ${next_tag}."

          echo "version=${next_version}" >>"${GITHUB_OUTPUT}"
          echo "tag=${next_tag}" >>"${GITHUB_OUTPUT}"

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: version
    if: always() && (github.ref_type == 'tag' || needs.version.result == 'success')
    steps:
      - name: Resolve release ref
        id: release
        shell: bash
        env:
          BUMPED_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${BUMPED_TAG}"
          fi

          if [[ -z "${tag}" ]]; then
            echo "No release tag was resolved." >&2
            exit 1
          fi

          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >>"${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Publish repository archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          asset_name="${GITHUB_REPOSITORY##*/}-${RELEASE_TAG}.zip"
          git archive --format=zip --output "${asset_name}" HEAD

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes "Workspace image release ${RELEASE_TAG}."
          fi

          gh release upload "${RELEASE_TAG}" "${asset_name}" --clobber

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_type == 'tag' }}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
